<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRide — Détail du trajet</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <nav class="navbar">
      <a href="index.html" class="logo">EcoRide</a>
      <ul class="nav-links">
        <li><a href="index.html">Accueil</a></li>
        <li><a href="covoiturages.html">Covoiturages</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-actions">
        <a href="profil.html" class="btn btn-vert">Mon espace</a>
      </div>
    </nav>

    <main style="padding: 120px 24px 60px; max-width: 760px; margin: auto">
      <a href="covoiturages.html" style="color: var(--vert-principal)">
        ← Retour aux covoiturages
      </a>

      <!-- Tout est caché au départ : on l'affiche une fois les données reçues -->
      <div id="contenu" hidden>
        <!-- BLOC 1 : le trajet -->
        <section class="bloc-detail">
          <div class="carte-chauffeur">
            <div class="avatar js-avatar"></div>
            <div>
              <div class="chauffeur-nom js-pseudo"></div>
              <div class="note-etoiles js-note"></div>
            </div>
          </div>

          <h1 class="trajet-titre js-trajet" style="margin-top: 16px"></h1>

          <div class="trajet-infos" style="margin-top: 14px">
            <div class="trajet-info-item js-date"></div>
            <div class="trajet-info-item js-horaires"></div>
            <div class="trajet-info-item js-duree"></div>
            <div class="trajet-info-item js-places"></div>
            <span class="badge-eco js-eco" hidden>🌱 Écologique</span>
          </div>

          <div class="ligne-info" style="margin-top: 14px">
            <span class="etiquette">Départ</span>
            <span class="valeur js-adresse-depart"></span>
          </div>
          <div class="ligne-info">
            <span class="etiquette">Arrivée</span>
            <span class="valeur js-adresse-arrivee"></span>
          </div>

          <div class="prix-detail js-prix" style="margin-top: 18px"></div>

          <button id="btn-participer" class="btn btn-vert" style="margin-top: 14px">
            Participer au trajet
          </button>
          <div id="message" style="margin-top: 16px"></div>
        </section>

        <!-- BLOC 2 : le véhicule (US 5) -->
        <section class="bloc-detail">
          <h2>🚗 Le véhicule</h2>
          <div class="ligne-info">
            <span class="etiquette">Marque</span><span class="valeur js-marque"></span>
          </div>
          <div class="ligne-info">
            <span class="etiquette">Modèle</span><span class="valeur js-modele"></span>
          </div>
          <div class="ligne-info">
            <span class="etiquette">Couleur</span><span class="valeur js-couleur"></span>
          </div>
          <div class="ligne-info">
            <span class="etiquette">Énergie</span><span class="valeur js-energie"></span>
          </div>
        </section>

        <!-- BLOC 3 : les préférences du conducteur (US 5) -->
        <section class="bloc-detail">
          <h2>💬 Les préférences du conducteur</h2>
          <div class="liste-preferences js-preferences"></div>
        </section>

        <!-- BLOC 4 : les avis VALIDÉS (US 5) -->
        <section class="bloc-detail">
          <h2 class="js-titre-avis">⭐ Les avis</h2>
          <div class="js-avis"></div>
        </section>
      </div>

      <!-- Message de chargement ou d'erreur -->
      <section class="bloc-detail" id="etat">
        <p id="etat-texte">Chargement du trajet…</p>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // ============================================
      // US 5 — Détail d'un covoiturage
      // Règle : tout ce qui vient de la base est posé avec textContent,
      // jamais avec innerHTML (protection contre les failles XSS).
      // ============================================

      // On lit le numéro du trajet dans l'adresse : detail.html?id=12
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      // Raccourci pour aller chercher un emplacement à remplir
      function dans(classe) {
        return document.querySelector("." + classe);
      }

      // Affiche un message à la place du contenu (chargement ou erreur)
      function afficherEtat(texte) {
        document.getElementById("etat").hidden = false;
        document.getElementById("etat-texte").textContent = texte;
      }

      // ---- Charger et afficher le trajet ----
      async function chargerDetail() {
        if (!id) {
          afficherEtat("Trajet introuvable : aucun numéro dans l'adresse.");
          return;
        }

        try {
          const reponse = await apiPublique("/covoiturages/" + id);
          const data = await reponse.json();

          if (!reponse.ok) {
            afficherEtat(data.message || "Erreur de chargement.");
            return;
          }

          remplirTrajet(data.trajet, data.note_moyenne);
          remplirVehicule(data.trajet.vehicule);
          remplirPreferences(data.preferences, data.preferences_perso);
          remplirAvis(data.avis);

          // Tout est prêt : on montre le contenu et on cache le message
          document.getElementById("etat").hidden = true;
          document.getElementById("contenu").hidden = false;
        } catch (erreur) {
          afficherEtat("Le serveur ne répond pas. Réessaie dans un instant.");
        }
      }

      // ---- Le trajet et son chauffeur ----
      function remplirTrajet(t, noteMoyenne) {
        const chauffeur = t.chauffeur || {};
        const pseudo = chauffeur.pseudo || "Chauffeur";

        document.title = "EcoRide — " + t.ville_depart + " → " + t.ville_arrivee;

        dans("js-pseudo").textContent = pseudo;

        dans("js-avatar").innerHTML = ""; // on repart d'un avatar vide
        if (chauffeur.photo) {
          const image = document.createElement("img");
          image.src = chauffeur.photo;
          image.alt = pseudo;
          dans("js-avatar").appendChild(image);
        } else {
          dans("js-avatar").textContent = pseudo[0].toUpperCase();
        }

        if (noteMoyenne) {
          dans("js-note").textContent = "⭐ " + noteMoyenne + " / 5";
        } else {
          dans("js-note").textContent = "⭐ Nouveau chauffeur";
        }

        dans("js-trajet").textContent = t.ville_depart + " → " + t.ville_arrivee;
        dans("js-date").textContent = "📅 " + formatDate(t.date_depart);
        dans("js-horaires").textContent =
          "🕐 " + formatHeure(t.heure_depart) + " → " + formatHeure(t.heure_arrivee);

        const duree = calculerDureeMinutes(t);
        if (duree === null) {
          dans("js-duree").hidden = true;
        } else {
          dans("js-duree").textContent = "⏱ " + formatDuree(duree);
        }

        dans("js-places").textContent =
          "👥 " + t.nb_places_restantes + " place(s) restante(s)";

        if (t.est_ecologique) dans("js-eco").hidden = false;

        dans("js-adresse-depart").textContent =
          t.adresse_depart || t.ville_depart;
        dans("js-adresse-arrivee").textContent =
          t.adresse_arrivee || t.ville_arrivee;

        dans("js-prix").textContent = t.prix_par_personne + " ";
        const unite = document.createElement("span");
        unite.textContent = "crédits par personne";
        dans("js-prix").appendChild(unite);

        // Plus de place : le bouton n'a plus de sens
        if (t.nb_places_restantes <= 0) {
          const bouton = document.getElementById("btn-participer");
          bouton.disabled = true;
          bouton.textContent = "Complet";
        }
      }

      // ---- Le véhicule (US 5) ----
      function remplirVehicule(v) {
        if (!v) return;
        dans("js-marque").textContent = v.marque || "—";
        dans("js-modele").textContent = v.modele || "—";
        dans("js-couleur").textContent = v.couleur || "—";
        dans("js-energie").textContent = nomEnergie(v.energie);
      }

      // "electrique" est la valeur en base ; on l'affiche joliment
      function nomEnergie(energie) {
        if (energie === "electrique") return "Électrique ⚡";
        if (energie === "hybride") return "Hybride";
        if (energie === "essence") return "Essence";
        if (energie === "diesel") return "Diesel";
        if (energie === "gpl") return "GPL";
        return "—";
      }

      // ---- Les préférences du conducteur (US 5) ----
      function remplirPreferences(prefs, prefsPerso) {
        const zone = dans("js-preferences");
        // On vide d'abord : sinon, si la fonction est rappelée, les pastilles
        // s'ajouteraient aux anciennes au lieu de les remplacer.
        zone.innerHTML = "";

        // Petite fonction pour ajouter une pastille.
        // "refus" met la pastille en rouge (non-fumeur, pas d'animaux).
        function ajouterPastille(texte, refus) {
          const pastille = document.createElement("span");
          pastille.className = refus
            ? "pastille-preference refus"
            : "pastille-preference";
          pastille.textContent = texte;
          zone.appendChild(pastille);
        }

        if (prefs) {
          if (prefs.accepte_fumeur) ajouterPastille("🚬 Fumeur accepté", false);
          else ajouterPastille("🚭 Non-fumeur", true);

          if (prefs.accepte_animaux) ajouterPastille("🐾 Animaux acceptés", false);
          else ajouterPastille("🚫 Pas d'animaux", true);

          // Ancien champ texte libre, gardé s'il est rempli
          if (prefs.preference_perso) {
            ajouterPastille(prefs.preference_perso, false);
          }
        }

        // Les préférences personnalisées : une pastille par ligne de la table
        if (prefsPerso) {
          prefsPerso.forEach(function (p) {
            ajouterPastille(p.libelle, false);
          });
        }

        if (zone.children.length === 0) {
          zone.textContent = "Ce conducteur n'a pas indiqué de préférences.";
        }
      }

      // ---- Les avis VALIDÉS du conducteur (US 5) ----
      function remplirAvis(avis) {
        const zone = dans("js-avis");
        zone.innerHTML = ""; // même précaution que pour les préférences

        dans("js-titre-avis").textContent =
          "⭐ Les avis (" + avis.length + ")";

        if (avis.length === 0) {
          zone.textContent = "Ce conducteur n'a pas encore d'avis publié.";
          return;
        }

        avis.forEach(function (a) {
          const carte = document.createElement("div");
          carte.className = "carte-avis";

          // Squelette sans aucune donnée : il est écrit par moi, donc sûr
          carte.innerHTML = `
            <div class="entete">
              <span class="auteur js-auteur"></span>
              <span class="date js-date-avis"></span>
            </div>
            <div class="note-etoiles js-note-avis"></div>
            <p class="texte js-texte-avis"></p>`;

          // Les données, en textContent
          const passager = a.passager || {};
          carte.querySelector(".js-auteur").textContent =
            passager.pseudo || "Passager";
          carte.querySelector(".js-date-avis").textContent =
            formatDate(a.created_at);
          carte.querySelector(".js-note-avis").textContent =
            "⭐".repeat(a.note) + " " + a.note + "/5";
          carte.querySelector(".js-texte-avis").textContent =
            a.commentaire || "";

          zone.appendChild(carte);
        });
      }

      // ---- Participer (US 6) ----
      async function participer() {
        if (!estConnecte()) {
          window.location.href = "connexion.html";
          return;
        }

        const zone = document.getElementById("message");
        try {
          const reponse = await apiProtegee("/covoiturages/" + id + "/participer", {
            method: "POST",
          });
          const data = await reponse.json();

          zone.className = reponse.ok ? "alerte alerte-succes" : "alerte alerte-erreur";
          zone.textContent = data.message;

          if (reponse.ok) window.location.reload();
        } catch (erreur) {
          zone.className = "alerte alerte-erreur";
          zone.textContent = "Le serveur ne répond pas.";
        }
      }

      // ---- Petits utilitaires d'affichage ----
      function formatDate(date) {
        if (!date) return "—";
        return new Date(date).toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }

      function formatHeure(heure) {
        if (!heure) return "--:--";
        return heure.slice(0, 5);
      }

      function minutesDepuisMinuit(heure) {
        const morceaux = heure.split(":");
        return Number(morceaux[0]) * 60 + Number(morceaux[1]);
      }

      function calculerDureeMinutes(t) {
        if (t.heure_depart && t.heure_arrivee) {
          const depart = minutesDepuisMinuit(t.heure_depart);
          const arrivee = minutesDepuisMinuit(t.heure_arrivee);
          let duree = arrivee - depart;
          if (duree < 0) duree = duree + 24 * 60;
          return duree;
        }
        if (t.duree_minutes) return t.duree_minutes;
        return null;
      }

      function formatDuree(minutes) {
        if (minutes === null) return "";
        const heures = Math.floor(minutes / 60);
        const reste = minutes % 60;
        if (heures === 0) return reste + " min";
        return heures + " h " + String(reste).padStart(2, "0");
      }

      document
        .getElementById("btn-participer")
        .addEventListener("click", participer);

      chargerDetail();
    </script>
  </body>
</html>
