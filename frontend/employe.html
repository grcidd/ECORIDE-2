<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoRide — Espace Employé</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .page-employe {
        padding-top: 80px;
        min-height: 100vh;
        background: var(--gris-fond);
      }

      .employe-header {
        background: linear-gradient(135deg, var(--vert-fonce), #2d4a3e);
        padding: 40px 48px;
        color: white;
      }

      .employe-header h1 {
        color: white;
        font-size: 1.8rem;
      }
      .employe-header p {
        color: rgba(255, 255, 255, 0.7);
        margin-top: 6px;
      }

      .employe-content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }

      .onglets-employe {
        display: flex;
        gap: 0;
        background: white;
        border-radius: var(--radius);
        padding: 6px;
        box-shadow: var(--ombre);
        margin-bottom: 32px;
        width: fit-content;
      }

      .onglet-employe {
        padding: 12px 24px;
        border: none;
        background: none;
        border-radius: 10px;
        font-family: var(--font-corps);
        font-size: 0.92rem;
        font-weight: 500;
        color: var(--gris-texte);
        cursor: pointer;
        transition: var(--transition);
      }

      .onglet-employe.actif {
        background: var(--vert-principal);
        color: white;
        font-weight: 600;
      }

      .panneau-employe {
        display: none;
      }
      .panneau-employe.actif {
        display: block;
      }

      /* Carte avis */
      .carte-avis {
        background: white;
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--ombre);
        border: 1px solid var(--gris-bordure);
        margin-bottom: 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 20px;
        align-items: start;
      }

      .avis-meta {
        font-size: 0.82rem;
        color: var(--gris-texte);
        margin-bottom: 8px;
      }

      .avis-contenu {
        font-size: 0.95rem;
        line-height: 1.6;
        color: var(--noir-doux);
        margin: 8px 0;
      }

      .avis-etoiles {
        color: var(--warning);
        font-size: 1rem;
      }

      .avis-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .btn-valider {
        background: var(--vert-pale);
        color: var(--vert-fonce);
        border: none;
        padding: 10px 16px;
        border-radius: var(--radius-petit);
        font-family: var(--font-corps);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
      }

      .btn-valider:hover {
        background: var(--vert-clair);
        color: white;
      }

      .btn-refuser {
        background: #ffe5e7;
        color: var(--erreur);
        border: none;
        padding: 10px 16px;
        border-radius: var(--radius-petit);
        font-family: var(--font-corps);
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        white-space: nowrap;
      }

      .btn-refuser:hover {
        background: var(--erreur);
        color: white;
      }

      /* Carte signalement */
      .carte-signalement {
        background: white;
        border-radius: var(--radius);
        padding: 24px;
        box-shadow: var(--ombre);
        border: 1px solid var(--gris-bordure);
        border-left: 4px solid var(--warning);
        margin-bottom: 16px;
      }

      .signalement-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
        flex-wrap: wrap;
        gap: 12px;
      }

      .signalement-trajet {
        font-weight: 700;
        font-size: 1rem;
        color: var(--noir-doux);
      }

      .signalement-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      .signalement-personne {
        background: var(--gris-fond);
        border-radius: var(--radius-petit);
        padding: 12px;
        font-size: 0.85rem;
      }

      .signalement-personne strong {
        display: block;
        margin-bottom: 2px;
      }

      .signalement-commentaire {
        background: #fff4e5;
        border-radius: var(--radius-petit);
        padding: 14px;
        font-size: 0.9rem;
        color: var(--noir-doux);
        line-height: 1.6;
        margin-bottom: 16px;
      }

      .zone-vide {
        text-align: center;
        padding: 60px 20px;
        color: var(--gris-texte);
      }

      .zone-vide .icone {
        font-size: 3rem;
        margin-bottom: 12px;
      }

      .compteur-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        background: var(--erreur);
        color: white;
        border-radius: 50%;
        font-size: 0.72rem;
        font-weight: 700;
        margin-left: 6px;
      }

      /* Pastille « En attente » sur un signalement.
         Mêmes règles que dans profil.html, pour garder le même look partout. */
      .statut-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 10px;
        border-radius: 100px;
        font-size: 0.78rem;
        font-weight: 600;
      }
      .statut-planifie {
        background: #eef2ff;
        color: #3730a3;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <a href="index.html" class="logo"><span></span> EcoRide</a>
      <div class="nav-actions">
        <span
          id="employe-nom"
          style="color: var(--gris-texte); font-size: 0.9rem"
        ></span>
        <button
          class="btn btn-contour"
          onclick="deconnecter()"
          style="padding: 8px 16px"
        >
          Déconnexion
        </button>
      </div>
    </nav>

    <div class="page-employe">
      <div class="employe-header">
        <h1>👔 Espace Employé</h1>
        <p>Modération des avis et gestion des signalements</p>
      </div>

      <div class="employe-content">
        <!-- Onglets -->
        <div class="onglets-employe">
          <button
            class="onglet-employe actif"
            onclick="afficherOnglet('avis', this)"
          >
            💬 Avis à valider
            <span class="compteur-badge" id="compteur-avis">0</span>
          </button>
          <button
            class="onglet-employe"
            onclick="afficherOnglet('signalements', this)"
          >
            ⚠️ Signalements
            <span class="compteur-badge" id="compteur-sig">0</span>
          </button>
        </div>

        <!-- AVIS -->
        <div id="message-employe" class="alerte" hidden></div>

        <div class="panneau-employe actif" id="panneau-avis">
          <div id="liste-avis">
            <div class="zone-chargement"><div class="loader"></div></div>
          </div>
        </div>

        <!-- SIGNALEMENTS -->
        <div class="panneau-employe" id="panneau-signalements">
          <div id="liste-signalements">
            <div class="zone-chargement"><div class="loader"></div></div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      // L'adresse de l'API vient maintenant de js/api.js (plus de localhost en dur).

      // Protection : doit être employé (role_id 2) ou admin (role_id 3)
      const user = getUser();
      if (!user || (user.role_id !== 2 && user.role_id !== 3)) {
        window.location.href = "connexion.html";
      }

      document.getElementById("employe-nom").textContent = `👔 ${user.pseudo}`;

      window.addEventListener("DOMContentLoaded", () => {
        chargerAvis();
        chargerSignalements();
      });

      function afficherOnglet(nom, btn) {
        document
          .querySelectorAll(".panneau-employe")
          .forEach((p) => p.classList.remove("actif"));
        document
          .querySelectorAll(".onglet-employe")
          .forEach((b) => b.classList.remove("actif"));
        document.getElementById(`panneau-${nom}`).classList.add("actif");
        btn.classList.add("actif");
      }

      // ---- Charger les avis ----
      // ---- Petit outil : fabriquer un élément avec du texte, sans risque ----
      // textContent met le texte TEL QUEL : même si une passagère écrit
      // <script>, ça s'affiche comme du texte et ne s'exécute jamais.
      // (innerHTML, lui, exécuterait le code : c'est la faille XSS.)
      function elem(balise, classe, texte) {
        const e = document.createElement(balise);
        if (classe) e.className = classe;
        if (texte !== undefined) e.textContent = texte;
        return e;
      }

      function zoneVide(icone, titre, sousTitre) {
        const d = elem("div", "zone-vide");
        d.appendChild(elem("div", "icone", icone));
        d.appendChild(elem("h3", null, titre));
        if (sousTitre) d.appendChild(elem("p", null, sousTitre));
        return d;
      }

      // ---- Charger les avis en attente de modération ----
      async function chargerAvis() {
        const liste = document.getElementById("liste-avis");
        try {
          const rep = await apiProtegee("/admin/avis");
          const data = await rep.json();
          const avis = data.avis || [];

          document.getElementById("compteur-avis").textContent = avis.length;
          liste.innerHTML = "";

          if (avis.length === 0) {
            liste.appendChild(
              zoneVide("✅", "Aucun avis en attente", "Tous les avis ont été traités.")
            );
            return;
          }

          avis.forEach((a) => liste.appendChild(creerCarteAvis(a)));
        } catch {
          liste.innerHTML = "";
          liste.appendChild(
            elem("div", "alerte alerte-erreur", "Impossible de charger les avis.")
          );
        }
      }

      // Construit la carte d'UN avis.
      function creerCarteAvis(a) {
        const carte = elem("div", "carte-avis");
        carte.id = "avis-" + a.avis_id;

        const gauche = elem("div");

        // Ligne « De X sur le chauffeur Y · Ville → Ville · date »
        const trajet = a.covoiturage
          ? " · " + a.covoiturage.ville_depart + " → " + a.covoiturage.ville_arrivee
          : "";
        gauche.appendChild(
          elem(
            "div",
            "avis-meta",
            "De " + (a.passager?.pseudo || "?") +
              " sur le chauffeur " + (a.chauffeur?.pseudo || "?") +
              trajet + " · " + formatDate(a.created_at)
          )
        );

        gauche.appendChild(elem("div", "avis-etoiles", "⭐".repeat(a.note || 0)));
        // Le commentaire vient d'une passagère : textContent, jamais innerHTML.
        gauche.appendChild(
          elem("div", "avis-contenu", "« " + (a.commentaire || "Aucun commentaire.") + " »")
        );
        carte.appendChild(gauche);

        const actions = elem("div", "avis-actions");

        const valider = elem("button", "btn-valider", "✅ Valider");
        valider.addEventListener("click", () => traiterAvis(a.avis_id, "valider"));
        actions.appendChild(valider);

        const refuser = elem("button", "btn-refuser", "❌ Refuser");
        refuser.addEventListener("click", () => traiterAvis(a.avis_id, "refuser"));
        actions.appendChild(refuser);

        carte.appendChild(actions);
        return carte;
      }

      // ---- Valider ou refuser un avis ----
      // action vaut "valider" ou "refuser" : c'est le nom de la route.
      // Affiche un message vert en haut de la page pendant 4 secondes
      function afficherMessage(texte) {
        const zone = document.getElementById("message-employe");
        zone.textContent = texte; // textContent : pas de HTML injecté
        zone.className = "alerte alerte-succes";
        zone.hidden = false;
        clearTimeout(zone.minuteur);
        zone.minuteur = setTimeout(() => (zone.hidden = true), 4000);
      }

      async function traiterAvis(id, action) {
        try {
          const rep = await apiProtegee(`/admin/avis/${id}/${action}`, {
            method: "PATCH",
          });
          const data = await rep.json();

          if (!rep.ok) {
            alert(data.message);
            return;
          }

          document.getElementById("avis-" + id)?.remove();

          // Message de confirmation pour l'employé
          afficherMessage(
            action === "valider"
              ? "✅ Avis validé : il est maintenant visible sur le profil du chauffeur."
              : "❌ Avis refusé : il ne sera pas publié."
          );

          const compteur = document.getElementById("compteur-avis");
          compteur.textContent = Math.max(0, parseInt(compteur.textContent) - 1);

          const liste = document.getElementById("liste-avis");
          if (liste.children.length === 0) {
            liste.appendChild(
              zoneVide("✅", "Aucun avis en attente", "Tous les avis ont été traités.")
            );
          }
        } catch {
          alert("Erreur serveur.");
        }
      }

      // ---- US 12 : charger les signalements à traiter ----
      // Ces données viennent de PostgreSQL (participations), pas de MongoDB :
      // c'est là que vit l'argent du chauffeur (colonne credits_verses).
      async function chargerSignalements() {
        const liste = document.getElementById("liste-signalements");
        try {
          const rep = await apiProtegee("/admin/signalements");
          const data = await rep.json();
          const sigs = data.signalements || [];

          document.getElementById("compteur-sig").textContent = sigs.length;
          liste.innerHTML = "";

          if (sigs.length === 0) {
            liste.appendChild(
              zoneVide("🎉", "Aucun signalement en attente", "Tout se passe bien sur EcoRide !")
            );
            return;
          }

          sigs.forEach((s) => liste.appendChild(creerCarteSignalement(s)));
        } catch {
          liste.innerHTML = "";
          liste.appendChild(
            elem("div", "alerte alerte-erreur", "Impossible de charger les signalements.")
          );
        }
      }

      // Construit la carte d'UN signalement.
      function creerCarteSignalement(s) {
        const trajet = s.covoiturage || {};
        const chauffeur = trajet.chauffeur || {};
        const gain = (trajet.prix_par_personne || 0) - (trajet.credits_plateforme || 0);

        const carte = elem("div", "carte-signalement");
        carte.id = "sig-" + s.participation_id;

        // --- En-tête : le trajet concerné ---
        const entete = elem("div", "signalement-header");
        const infos = elem("div");
        infos.appendChild(
          elem(
            "div",
            "signalement-trajet",
            "#" + (trajet.covoiturage_id || "?") + " · " +
              (trajet.ville_depart || "—") + " → " + (trajet.ville_arrivee || "—")
          )
        );
        const dates = elem(
          "div",
          null,
          "📅 " + formatDate(trajet.date_depart) + " · Signalé le " + formatDate(s.valide_le)
        );
        dates.style.cssText = "font-size:0.82rem; color:var(--gris-texte); margin-top:2px";
        infos.appendChild(dates);
        entete.appendChild(infos);
        entete.appendChild(elem("span", "statut-badge statut-planifie", "En attente"));
        carte.appendChild(entete);

        // --- Les deux personnes concernées ---
        const grille = elem("div", "signalement-grid");
        grille.appendChild(bloc("🎒 Passager", s.passager?.pseudo, s.passager?.email));
        grille.appendChild(bloc("🚗 Chauffeur", chauffeur.pseudo, chauffeur.email));
        carte.appendChild(grille);

        // --- Ce que la passagère a écrit (texte libre : textContent obligatoire) ---
        carte.appendChild(
          elem(
            "div",
            "signalement-commentaire",
            "💬 « " + (s.commentaire_probleme || "Aucun détail fourni.") + " »"
          )
        );

        // --- Rappel de ce qui est en jeu ---
        const enjeu = elem(
          "div",
          null,
          "💰 " + gain + " crédits sont bloqués : le chauffeur n'a pas été payé pour ce trajet."
        );
        enjeu.style.cssText =
          "font-size:0.85rem; color:var(--gris-texte); margin:10px 0";
        carte.appendChild(enjeu);

        // --- Les deux décisions possibles ---
        const actions = elem("div");
        actions.style.cssText = "display:flex; gap:10px; flex-wrap:wrap";

        const payer = elem("button", "btn btn-vert", "✅ Payer le chauffeur");
        payer.style.cssText = "padding:10px 20px; font-size:0.85rem";
        payer.addEventListener("click", () =>
          trancherSignalement(s.participation_id, true, chauffeur.pseudo, gain)
        );
        actions.appendChild(payer);

        const confirmer = elem("button", "btn btn-danger", "⚠️ Confirmer le problème");
        confirmer.style.cssText = "padding:10px 20px; font-size:0.85rem";
        confirmer.addEventListener("click", () =>
          trancherSignalement(s.participation_id, false, chauffeur.pseudo, gain)
        );
        actions.appendChild(confirmer);

        carte.appendChild(actions);
        return carte;
      }

      // Petit bloc « rôle / pseudo / email » dans la carte d'un signalement.
      function bloc(titre, pseudo, email) {
        const d = elem("div", "signalement-personne");
        d.appendChild(elem("strong", null, titre));
        d.appendChild(document.createElement("br"));
        d.appendChild(document.createTextNode(pseudo || "?"));
        if (email) {
          d.appendChild(document.createElement("br"));
          const a = document.createElement("a");
          a.href = "mailto:" + email;
          a.style.cssText = "color:var(--vert-principal); font-size:0.8rem";
          a.textContent = email;
          d.appendChild(a);
        }
        return d;
      }

      // ---- US 12 : l'employé tranche ----
      // crediter = true  → le chauffeur est enfin payé
      // crediter = false → le chauffeur ne sera jamais payé pour ce trajet
      async function trancherSignalement(id, crediter, pseudoChauffeur, gain) {
        const question = crediter
          ? `Payer ${gain} crédits à ${pseudoChauffeur || "ce chauffeur"} ?`
          : `Confirmer le problème ? ${pseudoChauffeur || "Ce chauffeur"} ne sera pas payé.`;
        if (!confirm(question)) return;

        try {
          const rep = await apiProtegee(`/admin/signalements/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ crediter }),
          });
          const data = await rep.json();

          if (!rep.ok) {
            alert(data.message);
            return;
          }

          alert(data.message);
          document.getElementById("sig-" + id)?.remove();

          const compteur = document.getElementById("compteur-sig");
          compteur.textContent = Math.max(0, parseInt(compteur.textContent) - 1);

          const liste = document.getElementById("liste-signalements");
          if (liste.children.length === 0) {
            liste.appendChild(
              zoneVide("🎉", "Aucun signalement en attente", "Tout se passe bien sur EcoRide !")
            );
          }
        } catch {
          alert("Erreur serveur.");
        }
      }

      function formatDate(d) {
        if (!d) return "—";
        return new Date(d).toLocaleDateString("fr-FR", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
      }
    </script>
  </body>
</html>
